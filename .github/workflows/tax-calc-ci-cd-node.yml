name: Tax Calculator Node App to AWS EKS


on:
  push:
    branches:
      - main
    paths:
      - 'docker/app1-hello/node/**'
  workflow_dispatch:

jobs:
    build-test:
            runs-on: ubuntu-latest
            strategy:
              matrix:
                service: [service-a, service-b]

            steps:
                - name: Checkout Code
                  uses: actions/checkout@v7

                - name: Setup Node.js
                  uses: actions/setup-node@v7
                  with:
                    node-version: '26'

                - name: Install Dependencies
                  working-directory: docker/app2-tax-calculator/node/${{ matrix.service }}
                  run: npm install

                - name: Run Tests (if any)
                  working-directory: docker/app2-tax-calculator/node/${{ matrix.service }}
                  run: npm test --if-present



    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test
        strategy:
          matrix:
            service: 
              - { name: "service-a", docker_name: "app-tax-calculator", path: "docker/app2-tax-calculator/node/service-a"}
              - { name: "service-b", docker_name: "app-tax-calculator", path: "docker/app2-tax-calculator/node/service-b"}
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v7
              with:
                context: ${{ matrix.service.path }}
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.docker_name }}:node-latest

    deploy-aws-eks:
        runs-on: ubuntu-latest
        needs: docker-build-push

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v3
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-1

            - name: Update Kubernetes Deployment
              run: |
                aws eks update-kubeconfig --name hello-cluster --region us-east-1
            - name: Verify connection
              run: kubectl get nodes

            - name: Deploy to AWS EKS
              run: |
                    kubectl apply -f docker/k8s/aws/service-a
                    kubectl apply -f docker/k8s/aws/service-b
                
    
    