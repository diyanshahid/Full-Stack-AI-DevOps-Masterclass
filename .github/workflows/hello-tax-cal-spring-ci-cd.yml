name: Tax Calculator Spring CI/CD to AWS EKS

on:
  #push
  #pull_request
  workflow_dispatch

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
            java-version: 17
            distribution: temurin

      - name: Build and Test (Maven)
        working-directory: docker/app2-tax-calculator/spring/${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app2-tax-calculator/spring/${{ matrix.service }}/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      matrix:
        service: 
          - { name: "service-a", docker_name: "app-tax-calculator", path: "docker/app2-tax-calculator/spring/service-a/target/surefire-reports"}
          - { name: "service-b", docker_name: "app-tax-calculator", path: "docker/app2-tax-calculator/spring/service-b/target/surefire-reports"}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
            java-version: 17
            distribution: temurin

      - name: Build JAR for Docker
        working-directory: ${{ matrix.service.path }}
        run: mvn -B clean package -DskipTests

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
            context: ${{ matrix.service.path }}
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.docker_name }}:latest

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig fro EKS
        run: |
          aws eks update-kubeconfig --name hello-cluster --region us-east-1

      - name: Verify connection
        run: kubectl get nodes

      - name: Deploy to AWS EKS
        run: | 
          kubectl apply -f docker/app2-tax-calculator/spring/service-a
          kubectl apply -f docker/app2-tax-calculator/spring/service-b