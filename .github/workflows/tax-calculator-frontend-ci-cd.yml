name: Tax Calculator Frontend CI/CD to AWS EKS

on:
  #push
  #pull_request
  workflow_dispatch

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env for Build
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env
        
      - name: Setup Nodejs
        uses: actions/setup-node@v7
        with:
            node-version: '26'

      - name: Install Dependencies
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm ci
      
      - name: Run Tests
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm test --if-present

      - name: Build Frontend
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: npm run build

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env for Build
        working-directory: docker/app2-tax-calculator/tax-calculator-frontend
        run: echo "VITE_API_URL=/api" > .env

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
            context: docker/app2-tax-calculator/tax-calculator-frontend
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/tax-calculator-frontend:latest

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name hello-cluster --region us-east-1

      - name: Verify connection
        run: kubectl get nodes

      - name: Deploy to AWS EKS
        run: | 
          kubectl apply -f k8s/aws/frontend
          kubectl apply -f k8s/aws/ingress.yaml