services:
    hello-py:
      build: ./python
      image: diyan993/hello-python:1.0
      ports:
        - 3000:3000
      environment:
        - ENV_VALUE=${ENV_VALUE_PYTHON}

    hello-node:
      build: ./node
      image: diyan993/hello-node:1.0
      ports:
        - 3001:3000
      environment:
        - ENV_VALUE=${ENV_VALUE_NODE}

    hello-spring:
      build: ./springboot/hello-spring
      image: diyan993/hello-spring:1.0
      ports:
        - 8086:8080
      environment:
        - ENV_VALUE=${ENV_VALUE_SPRING}